# Rebuilds index.xml (the file ReaPack reads) after every push to main.
name: ReaPack index
on:
  push:
    branches: [main]
    paths-ignore: [index.xml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install reapack-index
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc cmake pkg-config
          gem install reapack-index --no-document
      - name: Build and commit index.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          reapack-index --rebuild --commit --name "Lukashev Tools" --no-progress
          git push
